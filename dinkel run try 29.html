const COL=['#2f6fa8','#b5452b','#4f8a3a'],F=350,sc=z=>F/(z+F),R=Math.random;
const mk=run=>({run,lane:1,px:1,jy:0,vy:0,sl:0,dist:0,speed:620,obs:[],coins:0,sp:0,t:0,dead:0,shake:0,flash:0,parts:[],dt:0,score:0});
let S=mk(0);
function G(){return{hy:H*.36,gy:H*.84,lw:Math.min(W*.27,H*.26),cx:W/2}}
function dust(n,c,g){const{gy,lw,cx}=G(),x=cx+(S.px-1)*lw;for(let i=0;i<n;i++)S.parts.push({x:x+(R()-.5)*lw*.3,y:g?gy-lw*.6:gy,vx:(R()-.5)*lw*(g?1.6:.8),vy:-R()*lw*(g?1.4:.6),l:.5,r:lw*.045*(1+R()),c:c||'rgba(214,190,140,.7)',g:g?.4:1})}
function spawn(){const z=2200,free=(R()*3)|0,r=R();
 if(r<.4){for(let l=0;l<3;l++)if(l!=free&&R()<.8)S.obs.push({k:'b',l,z,f:(R()*2)|0})}
 else if(r<.7)S.obs.push({k:'h',l:(R()*3)|0,z});
 else S.obs.push({k:'t',l:(R()*3)|0,z});
 for(let i=0;i<5;i++)S.obs.push({k:'c',l:free,z:z+i*90})}

function update(dt){const s=S;if(s.flash>0)s.flash-=dt*1.2;if(s.shake>0)s.shake-=dt*1.5;
 s.parts=s.parts.filter(p=>(p.l-=dt)>0);for(const p of s.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*D*dt*p.g}
 s.t+=dt;
 if(!s.run){if(s.dead>0){s.dead-=dt;if(s.dead<=0)showOver()}else s.dist+=260*dt;return}
 s.speed=Math.min(1500,620+s.dist/55);s.dist+=s.speed*dt;s.px+=(s.lane-s.px)*Math.min(1,dt*14);
 if(s.jy>0||s.vy>0){s.vy-=7.4*dt;s.jy+=s.vy*dt;if(s.jy<=0){s.jy=0;s.vy=0;dust(6)}}
 if(s.sl>0)s.sl-=dt;
 s.dt-=dt;if(!s.jy&&s.dt<=0){dust(1);s.dt=.06}
 s.sp-=s.speed*dt;if(s.sp<=0){spawn();s.sp=650+R()*350-Math.min(250,s.dist/200)}
 for(const o of s.obs){o.z-=s.speed*dt;if(o.dead||o.z>32||o.z<-32||Math.abs(o.l-s.px)>.55)continue;
  if(o.k=='c'){o.dead=1;s.coins++;dust(5,'rgba(255,215,80,.95)',1)}

 s.obs=s.obs.filter(o=>o.z>-80&&!o.dead)}
